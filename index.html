<!DOCTYPE html>

    <style>

            margin: 0;

<body class="bg-black text-white relative">

    <!-- Canvas for the animated heart and background particles -->
    <canvas id="heartCanvas"></canvas>

    <!-- Overlay UI Controls -->
    <div class="absolute top-4 left-4 z-10 flex flex-wrap gap-3 items-center">

    <!-- Footer Credit -->

    </div>

    <script>
        // Setup Canvas and Context
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // State Management
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Customization Settings
        let customText = "I love you";
        let mainColor = "#ffb6c1";
        let drawSpeed = 5;
        let layerCount = 6;
        let enablePulse = true;

        // Animation State variables
        let progress = 0; // 0 to 1 representing drawing completeness
        let animationFrameId = null;
        let time = 0;

        // Mouse Interactivity
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetX = width / 2;
        let targetY = height / 2;

        // Background floating particles
        const particles = [];
        const PARTICLE_COUNT = 60;

        // Resize Canvas dynamically
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        // Track mouse for subtle interactive tilt/parallax
        window.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                targetX = e.touches[0].clientX;
                targetY = e.touches[0].clientY;
            }
        });

        // Initialize Background Particles
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 20 + Math.random() * 50;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.2 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                this.rotation += this.rotSpeed;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = mainColor;
                
                // Draw tiny heart path
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = new Particle();
                p.y = Math.random() * height; // Spread across screen initially
                particles.push(p);
            }
        }

        // Heart Parametric Formula Math
        // Based on Python code:
        // t in [0, 2pi]
        // x = 16 * sin(t)^3
        // y = 13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t)
        function getHeartPoint(t) {
            const sinT = Math.sin(t);
            const x = 16 * Math.pow(sinT, 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); // Invert y for canvas coords
            return { x, y };
        }

        // Main Draw Loop
        function animate() {
            time += 0.02;

            // Smooth mouse interpolation
            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            // Clear Screen
            ctx.fillStyle = "rgba(0, 0, 0, 0.25)"; // Trails effect
            ctx.fillRect(0, 0, width, height);

            // Update & Render background floating particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Increment Drawing Progress
            if (progress < 1) {
                progress += 0.002 * drawSpeed;
                if (progress > 1) progress = 1;
            }

            // Calculate Pulse Scaling
            let pulse = 1;
            if (enablePulse && progress >= 1) {
                pulse = 1 + Math.sin(time * 3) * 0.03 + Math.sin(time * 1.5) * 0.015;
            }

            // Interactive Offset based on Mouse position relative to center
            const offsetX = (mouseX - width / 2) * 0.03;
            const offsetY = (mouseY - height / 2) * 0.03;

            // Base Scale according to screen size
            const baseScale = Math.min(width, height) / 45 * pulse;
            const centerX = width / 2 + offsetX;
            const centerY = height / 2 + offsetY;

            // Configure Text rendering
            ctx.font = "bold 9px Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Set up glowing canvas filter effects
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = mainColor;

            const totalPointsPerLayer = 120;
            const currentPointsToDraw = Math.floor(totalPointsPerLayer * progress);

            // Scale layers (Range similar to Python loop: scale in range(11, 17))
            const minScaleFactor = 0.7;
            const maxScaleFactor = 1.15;

            for (let layer = 0; layer < layerCount; layer++) {
                // Calculate layer scale multiplier
                const layerFactor = minScaleFactor + (layer / Math.max(1, layerCount - 1)) * (maxScaleFactor - minScaleFactor);
                const currentScale = baseScale * layerFactor;

                // Alternate rotation/opacity slightly per layer for depth
                const alpha = 0.6 + (layer / layerCount) * 0.4;
                ctx.globalAlpha = alpha;

                for (let i = 0; i < currentPointsToDraw; i++) {
                    const t = (i * Math.PI * 2) / totalPointsPerLayer;
                    const point = getHeartPoint(t);

                    const px = centerX + point.x * currentScale;
                    const py = centerY + point.y * currentScale;

                    // Calculate rotation angle along the curve for natural text orientation
                    const nextPoint = getHeartPoint(t + 0.05);
                    const angle = Math.atan2((nextPoint.y - point.y), (nextPoint.x - point.x));

                    ctx.save();
                    ctx.translate(px, py);
                    // Slight dynamic tilt following curve direction
                    ctx.rotate(angle * 0.15); 
                    ctx.fillText(customText, 0, 0);
                    ctx.restore();
                }
            }

            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;

            animationFrameId = requestAnimationFrame(animate);
        }

        // Reset & Start Animation Sequence
        function restartAnimation() {
            progress = 0;
        }

        // Initial setup
        initParticles();
        animate();

        // --- UI Controller Event Listeners ---
        const controlsPanel = document.getElementById('controlsPanel');
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const closeControlsBtn = document.getElementById('closeControlsBtn');
        const replayBtn = document.getElementById('replayBtn');
        const messageInput = document.getElementById('messageInput');
        const colorPicker = document.getElementById('colorPicker');
        const colorHex = document.getElementById('colorHex');
        const speedSlider = document.getElementById('speedSlider');
        const densitySlider = document.getElementById('densitySlider');
        const pulseToggle = document.getElementById('pulseToggle');

        toggleControlsBtn.addEventListener('click', () => {
            controlsPanel.classList.toggle('hidden');
        });

        closeControlsBtn.addEventListener('click', () => {
            controlsPanel.classList.add('hidden');
        });

        replayBtn.addEventListener('click', () => {
            restartAnimation();
        });

        messageInput.addEventListener('input', (e) => {
            customText = e.target.value.trim() || "I love you";
        });

        colorPicker.addEventListener('input', (e) => {
            mainColor = e.target.value;
            colorHex.textContent = mainColor;
        });

        speedSlider.addEventListener('input', (e) => {
            drawSpeed = parseInt(e.target.value);
        });

        densitySlider.addEventListener('input', (e) => {
            layerCount = parseInt(e.target.value);
        });

        pulseToggle.addEventListener('change', (e) => {
            enablePulse = e.target.checked;
        });
    </script>
</body>
</html>

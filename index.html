
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Hansa ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050008;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  font-family: Arial, sans-serif;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.birthday {
  position: absolute;
  bottom: 8%;
  width: 100%;
  padding: 0 10px;
  text-align: center;
  color: #ffacd5;
  font-size: clamp(23px, 6vw, 38px);
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow:
    0 0 8px #ff168d,
    0 0 22px #ff168d;
  animation: birthdayGlow 1.8s ease-in-out infinite alternate;
}

@keyframes birthdayGlow {
  from {
    opacity: 0.75;
    transform: scale(0.98);
  }
  to {
    opacity: 1;
    transform: scale(1.03);
  }
}
</style>
</head>

<body>

<canvas id="love"></canvas>

<div class="birthday">
  HAPPY BIRTHDAY HANSA 🎂❤️
</div>

<script>
const canvas = document.getElementById("love");
const ctx = canvas.getContext("2d");

let W, H, dpr, scale, time = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(W / 38, H / 43, 15);

  if (W < 500) scale *= 0.9;
}

function heart(t) {
  return {
    x: 16 * Math.sin(t) ** 3,
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t))
  };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  time += 0.012;

  ctx.save();

  // Keep the heart above the birthday message
  ctx.translate(W / 2, H * 0.40);
  ctx.scale(scale, scale);

  const count = 180;
  const progress = (time * 0.7) % (Math.PI * 2);

  for (let i = 0; i < count; i++) {
    const t = (i / count * Math.PI * 2 + progress)
      % (Math.PI * 2);

    const p = heart(t);
    const next = heart(t + 0.005);

    const angle = Math.atan2(
      next.y - p.y,
      next.x - p.x
    );

    const glow = 0.55 + 0.45 *
      Math.sin(t * 4 - time * 5) ** 2;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    ctx.globalAlpha = glow;
    ctx.fillStyle = "#ff9dcc";
    ctx.shadowColor = "#ff168d";
    ctx.shadowBlur = 2;

    ctx.font = "bold 0.75px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("I love you", 0, 0);

    ctx.restore();
  }

  // Tiny glowing particles travel around the heart
  for (let i = 0; i < 30; i++) {
    const t = (time * 1.5 + i / 30 *
      Math.PI * 2) % (Math.PI * 2);

    const p = heart(t);

    ctx.beginPath();
    ctx.arc(p.x, p.y, 0.13, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ff168d";
    ctx.shadowBlur = 6;
    ctx.fill();
  }

  ctx.restore();

  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

resize();
draw();
</script>

</body>
</html>

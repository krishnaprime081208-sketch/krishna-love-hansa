
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hansa ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080008;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.birthday {
  position: fixed;
  bottom: 7%;
  left: 0;
  width: 100%;
  padding: 12px;
  text-align: center;
  color: #ffacd5;
  font-size: clamp(21px, 5.5vw, 38px);
  font-weight: bold;
  letter-spacing: 1px;
  text-shadow: 0 0 10px #ff168d, 0 0 25px #ff168d;
  animation: glow 1.5s ease-in-out infinite alternate;
}

@keyframes glow {
  from { opacity: 0.7; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<div class="birthday">HAPPY BIRTHDAY HANSA 🎂❤️</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width, height, scale, dpr;
let rotation = 0;
let lastTime = 0;

const TAU = Math.PI * 2;
const WORD_COUNT = 110;

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t))
  };
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(width / 39, height / 43, 16);
}

function draw(timestamp) {
  if (!lastTime) lastTime = timestamp;

  const delta = Math.min(timestamp - lastTime, 40);
  lastTime = timestamp;

  ctx.clearRect(0, 0, width, height);

  // Continuous rotation
  rotation += delta * 0.00035;

  // Keep the heart above the birthday message
  ctx.save();
  ctx.translate(width / 2, height * 0.40);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);

  for (let i = 0; i < WORD_COUNT; i++) {
    // Text continuously travels around the heart
    const t = (i / WORD_COUNT * TAU
      + timestamp * 0.00045) % TAU;

    const p = heart(t);
    const next = heart(t + 0.002);

    const angle = Math.atan2(
      next.y - p.y,
      next.x - p.x
    );

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    const brightness = 0.65 + 0.35 *
      Math.sin(t * 5 - timestamp * 0.004);

    ctx.globalAlpha = brightness;
    ctx.fillStyle = "#ff9dcc";
    ctx.shadowColor = "#ff168d";
    ctx.shadowBlur = 1.2;

    ctx.font = "bold 0.8px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("I love you", 0, 0);

    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(draw);
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #09000b;
  color: white;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.content {
  position: absolute;
  top: 76%;
  width: 100%;
  text-align: center;
  padding: 15px;
  animation: glow 2s infinite alternate;
}

h1 {
  color: #ff69b4;
  font-size: clamp(25px, 7vw, 42px);
  text-shadow: 0 0 15px #ff168d, 0 0 35px #ff168d;
}

p {
  margin-top: 12px;
  color: #ffd4e9;
  font-size: 16px;
}

@keyframes glow {
  from { opacity: .75; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="content">
  <h1>I LOVE YOU ❤️</h1>
  <p>You're my favourite person in this world ✨</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, particles = [], time = 0, scale;

function heart(t) {
  return {
    x: 16 * Math.sin(t) ** 3,
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t))
  };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(W / 38, H / 38, 17);
  createParticles();
}

function createParticles() {
  particles = [];

  // Heart outline
  for (let i = 0; i < 160; i++) {
    const p = heart(Math.random() * Math.PI * 2);
    particles.push({
      x: p.x, y: p.y,
      size: 0.5 + Math.random() * 0.4,
      phase: Math.random() * 6.28
    });
  }

  // Filled heart
  for (let i = 0; i < 600; i++) {
    const p = heart(Math.random() * Math.PI * 2);
    const r = Math.sqrt(Math.random());

    particles.push({
      x: p.x * r,
      y: p.y * r,
      size: 0.45,
      phase: Math.random() * 6.28
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  time += 0.025;

  const pulse = 1 + 0.035 * Math.sin(time * 2);

  ctx.save();
  ctx.translate(W / 2, H * 0.40);
  ctx.scale(scale * pulse, scale * pulse);

  particles.forEach(p => {
    const glow = 0.65 + 0.35 *
      Math.sin(time * 2 + p.phase);

    ctx.globalAlpha = glow;
    ctx.fillStyle = "#ff8ac4";
    ctx.shadowColor = "#ff168d";
    ctx.shadowBlur = 1.5;

    ctx.font = `bold ${p.size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("I love you", p.x, p.y);
  });

  ctx.restore();

  // Floating stars
  ctx.shadowBlur = 0;

  for (let i = 0; i < 45; i++) {
    const x = (i * 83 + time * 9) % W;
    const y = (i * 137) % H;
    ctx.globalAlpha = 0.3 + 0.7 *
      Math.abs(Math.sin(time + i));

    ctx.fillStyle = "#ffc5e3";
    ctx.fillRect(x, y, 2, 2);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();
</script>

</body>
</html>
